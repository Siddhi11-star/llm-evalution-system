<script>
  (function() {
    document.addEventListener('DOMContentLoaded', () => {
      const path = window.location.pathname.split('/').pop() || 'dashboard.html';
      const container = document.getElementById('sidebar-links-container');
      if (!container) return;
      const links = container.querySelectorAll('a');
      links.forEach(link => {
        const href = link.getAttribute('href');
        if (href && path.startsWith(href.split('.')[0])) {
          link.classList.remove('text-on-surface-variant', 'dark:text-surface-variant', 'font-medium', 'border-transparent');
          link.classList.add('bg-surface-container-high', 'dark:bg-surface-container', 'text-primary', 'dark:text-inverse-primary', 'font-bold', 'border-secondary');
        } else {
          link.classList.remove('bg-surface-container-high', 'dark:bg-surface-container', 'text-primary', 'dark:text-inverse-primary', 'font-bold', 'border-secondary');
          link.classList.add('text-on-surface-variant', 'dark:text-surface-variant', 'font-medium', 'border-transparent');
        }
      });
    });
  })();
</script>
