          theme: {

<body class="bg-background text-on-surface font-body-md min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Login Container -->
<main class="w-full max-w-md px-gutter relative z-10">
<div class="bg-card-fill border border-border-subtle rounded shadow-card p-padding_card flex flex-col items-center w-full">
<!-- Brand Anchor -->
<div class="mb-8 text-center w-full"><div class="flex flex-col items-center gap-3">
  <div class="w-8 h-8 bg-primary rounded flex items-center justify-center">
    <span class="material-symbols-outlined text-on-primary text-[20px]" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;">gavel</span>
  </div>
  <div class="text-center">
    <h1 class="font-h3 text-h3 text-primary mb-1">JudgeLens</h1>
    <p class="font-body-md text-body-md text-on-surface-variant">AI Evaluation Infrastructure</p>
  </div>
</div></div>
<!-- Login Form -->
<form class="w-full space-y-5 flex-col" onsubmit="event.preventDefault();">
<div class="space-y-4">
<!-- Email Field -->
<div class="relative">
<label class="sr-only" for="email">Email Address</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]" data-icon="mail">mail</span>
</div>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-border-subtle rounded font-body-md text-body-md text-on-surface placeholder-on-surface-variant/60 focus:ring-1 focus:ring-primary focus:border-primary transition-shadow duration-200" id="email" name="email" placeholder="Email address" required="" type="email">
</div>
<!-- Password Field -->
<div class="relative">
<label class="sr-only" for="password">Password</label>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]" data-icon="key">key</span>
</div>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-border-subtle rounded font-body-md text-body-md text-on-surface placeholder-on-surface-variant/60 focus:ring-1 focus:ring-primary focus:border-primary transition-shadow duration-200" id="password" name="password" placeholder="Password" required="" type="password">
</div>
</div>
<!-- Utilities -->
<div class="flex items-center justify-between font-body-md text-body-md">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="rounded-sm border-border-subtle text-primary focus:ring-primary h-4 w-4 transition-colors" type="checkbox">
<span class="text-on-surface-variant group-hover:text-primary transition-colors">Remember device</span>
</label>
<a class="text-[#4b41e1] hover:underline transition-colors font-medium" href="#">Reset credential</a>
</div>
<!-- Primary Action -->
<button class="w-full py-2.5 bg-primary text-on-primary rounded font-body-md text-body-md font-medium hover:bg-inverse-surface active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2 group" type="submit">
<span class="">Initialize Session</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="w-full flex items-center gap-4 my-6">
<div class="h-px bg-border-subtle flex-1"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Or connect with</span>
<div class="h-px bg-border-subtle flex-1"></div>
</div>
<!-- SSO Options -->
<div class="w-full space-y-3 flex-col">
<button class="w-full py-2.5 bg-surface-container-lowest border border-border-subtle rounded font-body-md text-body-md text-on-surface hover:bg-surface-variant active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-3" type="button">
<img alt="Google" class="w-4 h-4 opacity-80" data-alt="A minimalist, highly detailed SVG icon representing the Google logo in a sleek, monochrome light-mode UI style. The icon is clean, sharp, and perfectly balanced, intended for a professional software dashboard." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBW7KdsUwqFW1Wrr-ua98cAO2FPH3efJ_6Ew3mRSqCxjaQX3SC9i0NYwg26o7hR903QvF0_4iIi1dGi_1JS_D5QVBAhdaMYQ6Eik_jiJYFBoyQCbscZdNFr2hoR9BOHHg8T-4KVq8mKr0pyLuxBgajKKFUpym-NN7Qskgdm4sM07gZ2r41dyyTCCGCVtGk7lqRXa1k2WtKziaOnUufSAEkI0BhBYv8Fb7M6Y5t_EUU0FxUXNmZHDy7x4A">
<span class="">Continue with Google</span>
</button>
<button class="w-full py-2.5 bg-surface-container-lowest border border-border-subtle rounded font-body-md text-body-md text-on-surface hover:bg-surface-variant active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-3" type="button">
<img alt="GitHub" class="w-4 h-4 opacity-80" data-alt="A minimal, sharp SVG icon representing the GitHub cat logo. Designed for a premium light-mode tech dashboard, the icon uses deep charcoal tones and crisp vector lines, emitting a highly technical and developer-focused aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAYy1nGG9Jw__20weUPx1amz4ZedYL4KXLd5AKiDi66FEv0Lj4lRRgUbSmqa0UvOH8qTa4jQ0DoMus5W3wRzWeDm2C46GbH4FXZICz-G5ptsZbkiv_p3M942ilVxY8Qe6X2OmO0kZxzlPZ3f2E95HsA18BNIe7_4Cyr_H3UCCAU8lQxNtrGdIwdkqJmlsCidmgrruiQAHPOogALOLwAZKebUt7PL_BiBbZ0lhzEZ30RCVuLDKXns9vbSg">
<span class="">Continue with GitHub</span>
</button>
</div>
</div>
<!-- Footer Links -->
<div class="mt-6 text-center flex flex-col gap-2 w-full items-center">
<p class="font-caption text-caption text-on-surface-variant">
                By authenticating, you accept our <a class="text-[#4b41e1] hover:underline" href="#">Service Terms</a> and <a class="text-[#4b41e1] hover:underline" href="#">Privacy Protocol</a>.
            </p>
</div>
</main>


</body></html>
