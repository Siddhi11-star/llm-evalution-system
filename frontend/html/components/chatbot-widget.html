<!--
  chatbot-widget.html — Floating chat FAB + expandable panel used on all app
  pages (dashboard, judge-agents, advisor-agent, billing, model-providers) and
  on the landing page (FAB-only variant — see note below).

  APP PAGES VARIANT (full panel + FAB, from dashboard.html):
  The panel is hidden by default and toggled via the FAB onclick.
  DO NOT modify any classes, spacing, colors, or copy in this file.
-->

<!-- Floating Chatbot Widget -->
<div class="fixed bottom-margin-page right-margin-page z-30 flex flex-col items-end gap-unit-md">
    <!-- Chat Panel (Hidden by default) -->
    <div id="chat-panel" class="hidden w-[360px] h-[420px] bg-surface-bright border border-outline-variant rounded-xl shadow-lg flex flex-col overflow-hidden">
        <div class="bg-primary p-unit-md flex justify-between items-center">
            <h3 class="text-on-primary font-headline-sm text-headline-sm">Evaluation Advisor</h3>
            <button id="close-chat-btn" class="text-on-primary hover:opacity-80">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-unit-md flex flex-col gap-unit-sm bg-surface-container-lowest">
            <div class="bg-surface-container p-unit-sm rounded-lg max-w-[80%] self-start">
                <p class="text-body-sm">Hello! I'm your Evaluation Advisor. How can I help you analyze your model performance today?</p>
            </div>
        </div>
        <div class="p-unit-sm border-t border-outline-variant bg-surface flex gap-unit-xs">
            <input type="text" placeholder="Ask a question..." class="flex-1 bg-surface-container-low border border-outline-variant rounded px-unit-sm py-1 text-body-sm focus:border-secondary focus:ring-0 outline-none">
            <button class="bg-secondary text-on-secondary p-1 rounded flex items-center justify-center">
                <span class="material-symbols-outlined text-sm">send</span>
            </button>
        </div>
    </div>
    <!-- FAB -->
    <button id="toggle-chat-btn" class="w-[56px] h-[56px] bg-primary text-on-primary rounded-full shadow-lg flex items-center justify-center hover:scale-105 transition-transform">
        <span class="material-symbols-outlined text-2xl">forum</span>
    </button>
</div>
